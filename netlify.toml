# Marketing form submission env (set in Netlify site env):
#   MARKETING_SUPABASE_URL = https://jeukkkxmamedvubookiw.supabase.co
#   MARKETING_SUPABASE_KEY = service role key from Supabase dashboard
#   RESEND_API_KEY         = send-only API key from Resend dashboard
#
# Power Automate path (MS_FLOW_SIGNUP_URL / MS_FLOW_MESSAGES_URL) was removed
# in feature/marketing-forms-supabase-resend-cutover. Forms now go directly to
# Supabase via /.netlify/functions/form-submission, which also sends
# confirmation + internal-alert emails via Resend.

[build]
  # No build step — publishing the standalone HTML deploy folder directly
  command = ""
  publish = "standalone-deploy"

[functions]
  directory = "standalone-deploy/netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
