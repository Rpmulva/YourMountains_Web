# Marketing form submission env (set in Netlify site env):
#   MARKETING_SUPABASE_URL = https://jeukkkxmamedvubookiw.supabase.co
#   MARKETING_SUPABASE_KEY = service role key from Supabase dashboard
#   RESEND_API_KEY         = send-only API key from Resend dashboard
#
# Power Automate path (MS_FLOW_SIGNUP_URL / MS_FLOW_MESSAGES_URL) was removed
# in feature/marketing-forms-supabase-resend-cutover. Forms now go directly to
# Supabase via /.netlify/functions/form-submission, which also sends
# confirmation + internal-alert emails via Resend.

[build]
  # No build step — publishing the standalone HTML deploy folder directly
  command = ""
  publish = "standalone-deploy"

[functions]
  directory = "standalone-deploy/netlify/functions"

# Extensionless aasa needs an explicit MIME type for swcd.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# OAuth return carries a code in the query. Block Netlify RUM and any other
# external script from running or connecting. Static file still wins the route.
[[headers]]
  for = "/calendar-oauth"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; connect-src 'none'; img-src 'none'; frame-src 'none'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/calendar-oauth.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; connect-src 'none'; img-src 'none'; frame-src 'none'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
