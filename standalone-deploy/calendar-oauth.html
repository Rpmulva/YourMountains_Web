<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Return to YourMountains</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0A0A0A;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  a {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 20px;
    background: #6F7D45;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    border-radius: 8px;
  }
</style>
</head>
<body>
<p>Returning to YourMountains…</p>
<p><a id="return-app" href="yourmountains://calendar-oauth">Return to YourMountains</a></p>
<script>
(function () {
  // G78 — Android finishes the connection here, on the server. The app link
  // carries no code or state, so the app never calls complete_oauth.
  if (navigator.userAgent.indexOf('Android') === -1) {
    document.getElementById('return-app').href = 'yourmountains://calendar-oauth' + location.search;
    location.replace('yourmountains://calendar-oauth' + location.search);
    return;
  }

  // G81 — not a calendar-oauth link, so the app's open sign-in resolves as
  // dismissed (no false "Sign-in expired") and Calendar reloads on focus.
  document.getElementById('return-app').href = 'yourmountains://profile/calendar';
  var message = document.querySelector('p');
  var params = new URLSearchParams(location.search);
  var code = params.get('code');
  var state = params.get('state');
  var oauthError = params.get('error');
  history.replaceState(null, '', location.pathname);

  if (oauthError || !code || !state) {
    message.textContent = 'Calendar not connected.';
    return;
  }

  message.textContent = 'Connecting your calendar…';
  fetch('https://sbjaqhsexlwqfowckddk.supabase.co/functions/v1/calendar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'complete_oauth_return', code: code, state: state }),
    credentials: 'omit'
  })
    .then(function (res) {
      return res.json().then(
        function (data) { return { ok: res.ok, data: data || {} }; },
        function () { return { ok: false, data: {} }; }
      );
    })
    .then(function (out) {
      if (out.ok && out.data.ok === true) {
        message.textContent = 'Google Calendar connected';
      } else if (out.data.error === 'state_expired') {
        message.textContent = 'That link expired. Go back to YourMountains and tap Connect again.';
      } else {
        message.textContent = "We couldn't finish connecting your calendar. Go back to YourMountains and try again.";
      }
    })
    .catch(function () {
      message.textContent = "We couldn't finish connecting your calendar. Go back to YourMountains and try again.";
    });
})();
</script>
