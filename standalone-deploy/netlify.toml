# Marketing form submission env vars (set in Netlify site settings):
#   MARKETING_SUPABASE_URL = https://jeukkkxmamedvubookiw.supabase.co
#   MARKETING_SUPABASE_KEY = service role key from Supabase dashboard
#   RESEND_API_KEY         = send-only API key from Resend dashboard
#
# Power Automate (MS_FLOW_*) removed in feature/marketing-forms-supabase-resend-cutover.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# OAuth return carries a code in the query. Block Netlify RUM and any other
# external script from running or connecting. Static file still wins the route.
[[headers]]
  for = "/calendar-oauth"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; connect-src 'none'; img-src 'none'; frame-src 'none'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/calendar-oauth.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; connect-src 'none'; img-src 'none'; frame-src 'none'; form-action 'none'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
